[package]
name = "aerowave-core"
version = "0.6.2"
edition = "2021"
license = "MIT"
description = "Parsing and scheduling rules, with no GUI dependencies so they can be unit tested"

[dependencies]
chrono = "0.4"

[dev-dependencies]
# Real DST transitions for the scheduling tests; FixedOffset cannot express one.
chrono-tz = "0.10"
