[package]
name = "aerowave-core"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "Parsing and scheduling rules, with no GUI dependencies so they can be unit tested"

[dependencies]
base64 = "0.22"
chrono = "0.4"
# 0.22.3 raised its MSRV to Rust 1.85; Aerowave still supports Rust 1.77.
# Compressed ID3 frames are rare and can expand beyond the input read budget.
lofty = { version = "=0.21.1", default-features = false }
# 0.40 raised its MSRV above Aerowave's Rust 1.77 floor.
quick-xml = "=0.39.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Real DST transitions for the scheduling tests; FixedOffset cannot express one.
chrono-tz = "0.10"
serde_json = "1"
