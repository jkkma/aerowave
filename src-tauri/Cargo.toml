[workspace]
members = ["core"]

[package]
name = "aerowave"
version = "0.12.3"
description = "Internet radio player and alarm clock"
authors = ["jkkma"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "aerowave_lib"
# Android loads the Rust entry point from a shared library. Keep tests in core
# so the desktop GUI stack is never exported into a test executable.
crate-type = ["cdylib", "rlib"]
# A test binary built from this crate links WebView2 and the Win32 GUI stack
# and will not load outside a real app process. Everything worth unit testing
# lives in the aerowave-core crate, which links none of that.
test = false

[[bin]]
name = "aerowave"
path = "src/main.rs"
test = false

# The relaycheck example runs the relay outside the app, so it needs a
# runtime of its own. Dev-only: none of this reaches a release build.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aerowave-core = { path = "core" }
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
rand = "0.8"
# Station artwork reaches the webview inline, as a data URL.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset", "http2"] }
# net/io-util are for the Shoutcast fallback in stream.rs, which has to
# talk to those servers over a socket rather than through an HTTP client.
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
futures-util = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-audio = { path = "plugins/tauri-plugin-android-audio" }

[target.'cfg(windows)'.dependencies]
# auto-launch tells us one bit; the logon entry has more to say than that.
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
# The power probe intercepts display-off requests in its own message-only window.
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
