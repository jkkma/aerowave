[workspace]
members = ["core"]

[package]
name = "aerowave"
version = "0.6.2"
description = "Internet radio player and alarm clock"
authors = ["jkkma"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "aerowave_lib"
# Desktop only. The cdylib/staticlib pair the mobile templates use makes the
# mingw linker fall over ("export ordinal too large") when building the tests.
crate-type = ["rlib"]
# A test binary built from this crate links WebView2 and the Win32 GUI stack
# and will not load outside a real app process. Everything worth unit testing
# lives in the aerowave-core crate, which links none of that.
test = false

[[bin]]
name = "aerowave"
path = "src/main.rs"
test = false

# The relaycheck example runs the relay outside the app, so it needs a
# runtime of its own. Dev-only: none of this reaches a release build.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aerowave-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
rand = "0.8"
# Station artwork reaches the webview inline, as a data URL.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset", "http2"] }
# net/io-util are for the Shoutcast fallback in stream.rs, which has to
# talk to those servers over a socket rather than through an HTTP client.
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
futures-util = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# auto-launch tells us one bit; the logon entry has more to say than that.
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
