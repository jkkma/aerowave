"$schema" = "schemas/schema.json"

[default]
description = "Allows Aerowave to control its Android background radio player."
permissions = [
  "allow-play",
  "allow-pause",
  "allow-resume",
  "allow-stop",
  "allow-get-state",
  "allow-set-volume",
  "allow-update-artwork",
  "allow-set-metadata-enabled",
  "allow-set-sleep-timer",
  "allow-cancel-sleep-timer",
  "allow-get-sleep-timer",
  "allow-sync-alarms",
  "allow-get-alarm-state",
  "allow-skip-alarm",
  "allow-snooze-alarm",
  "allow-dismiss-alarm",
  "allow-test-alarm",
  "allow-open-alarm-settings",
  "allow-pick-folder",
  "allow-folder-info",
  "allow-random-track",
  "allow-read-backup-file",
  "allow-save-backup-file",
]
